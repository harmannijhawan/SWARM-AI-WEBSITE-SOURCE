plugins {
    id 'com.android.application'
    // Kotlin is built into AGP 9.x (no org.jetbrains.kotlin.android plugin needed).
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.swarm.ai'
    compileSdk 37

    defaultConfig {
        applicationId "com.swarm.ai"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (System.getenv('SWARM_ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('SWARM_ANDROID_KEYSTORE'))
                storePassword System.getenv('SWARM_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SWARM_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SWARM_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('SWARM_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll(
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
        )
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // Hilt (KSP)
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'

    // Room (KSP)
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Remote companion: networking (cert-pinned HTTPS + WebSocket), QR scanning
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.3.21'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.json:json:20260814'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
// Never let an unsigned APK be mistaken for a signed release.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } &&
        ['SWARM_ANDROID_KEYSTORE','SWARM_ANDROID_STORE_PASSWORD','SWARM_ANDROID_KEY_ALIAS','SWARM_ANDROID_KEY_PASSWORD'].any { !System.getenv(it) }) {
        throw new GradleException('Android release requires SWARM_ANDROID_KEYSTORE, SWARM_ANDROID_STORE_PASSWORD, SWARM_ANDROID_KEY_ALIAS and SWARM_ANDROID_KEY_PASSWORD. Debug builds are not production releases.')
    }
}
